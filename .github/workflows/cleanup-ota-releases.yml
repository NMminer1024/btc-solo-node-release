name: Cleanup OTA Releases

on:
  push:
    tags:
      - "cleanup-ota-releases-*"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release repo
        uses: actions/checkout@v4

      - name: Delete old OTA releases
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_TAG: vx.x.xx-rockbase-k230-20260904-562bc52-ota
        shell: bash
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            if [ "$tag" = "$KEEP_TAG" ]; then
              echo "keeping $tag"
              continue
            fi
            echo "deleting release $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
