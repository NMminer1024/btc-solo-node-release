name: Cleanup OTA Releases

on:
  push:
    tags:
      - "cleanup-ota-releases-*"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete all OTA releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "deleting release $tag"
            gh release delete "$tag" --cleanup-tag --yes || true
          done
