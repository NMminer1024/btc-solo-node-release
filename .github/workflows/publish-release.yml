name: Publish OTA Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release repo
        uses: actions/checkout@v4

      - name: Validate package files
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          dir="release-packages/${version}"
          test -f "${dir}/manifest.json"
          test -f "${dir}/slot-${version}.img.gz"
          test -f "${dir}/slot-${version}.img.gz.sig"
          test -f "${dir}/RELEASE_NOTES.md"

      # action-gh-release does NOT overwrite the body of an existing release,
      # so delete any stale release first (idempotent: 404 is fine).
      - name: Delete existing release (if any)
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          # NOTE: no -f on this curl: a 404 (no release yet) must not abort
          # under set -e; the python side prints an empty id in that case.
          rid=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${version}" \
            | python3 -c "import json,sys
try:
    print(json.load(sys.stdin).get('id') or '')
except Exception:
    print('')")
          if [ -n "$rid" ]; then
            code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${rid}")
            echo "deleted release ${rid} (HTTP ${code})"
          else
            echo "no existing release for ${version}, nothing to delete"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-packages/${{ github.ref_name }}/RELEASE_NOTES.md
          files: |
            release-packages/${{ github.ref_name }}/manifest.json
            release-packages/${{ github.ref_name }}/slot-${{ github.ref_name }}.img.gz
            release-packages/${{ github.ref_name }}/slot-${{ github.ref_name }}.img.gz.sig
          fail_on_unmatched_files: true
